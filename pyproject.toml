[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "counterbouncer"
version = "0.2.0"
description = "Bouncer for Linux PMU measurements (integrity + experiment context)"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
analysis = ["matplotlib>=3.8", "pandas>=2"]
test = ["pytest>=8"]

[project.scripts]
bouncer = "counterbouncer.cli:main"
counterbouncer = "counterbouncer.cli:main"

[tool.setuptools.packages.find]
include = ["counterbouncer*"]
